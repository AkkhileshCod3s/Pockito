<style>
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.float{animation:fl 3.2s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.2s ease-in-out infinite alternate}
@keyframes sh{from{transform:scale(1);opacity:.35}to{transform:scale(.86);opacity:.22}}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.heart{animation:ht 4s ease-out infinite;opacity:0}
@keyframes ht{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(14px,-70px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
