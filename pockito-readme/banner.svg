<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="'Segoe UI','Trebuchet MS',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif">
<defs><linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60CBF7"/><stop offset="1" stop-color="#2D7DDE"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6FD1FA"/><stop offset="1" stop-color="#2C7BDD"/></linearGradient>
<pattern id="px" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="9" y="9" width="3" height="3" fill="#fff" opacity=".16"/></pattern>
