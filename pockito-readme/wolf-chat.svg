<text font-size="15.5" fill="#2B2B33"><tspan x="76" y="170"><tspan font-weight="800">Woof woof!</tspan> Hi there! I'm so excited to see</tspan><tspan x="76" y="192">you. Ready to give you a big, happy wag!</tspan></text></g>

