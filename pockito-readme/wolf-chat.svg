<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 70 470 350" width="470" height="350" font-family="'Segoe UI','Trebuchet MS',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif">
<defs>
<filter id="sd" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#2A3B5C" flood-opacity=".28"/></filter>
<filter id="sm" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2A3B5C" flood-opacity=".18"/></filter>
<linearGradient id="send" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4E3FB"/><stop offset="1" stop-color="#86C0F2"/></linearGradient>
<linearGradient id="ib" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9F3FC"/></linearGradient>
</defs>
<style>
.pop{transform-box:fill-box;transform-origin:50% 100%;opacity:0}
.u{animation:u 10s infinite} .r{animation:r 10s infinite} .ty{animation:ty 10s infinite}
@keyframes u{0%,2%{opacity:0;transform:translateY(12px) scale(.85)}6%,90%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes ty{0%,9%{opacity:0}11%,24%{opacity:1}27%,100%{opacity:0}}
@keyframes r{0%,26%{opacity:0;transform:translateY(12px) scale(.9)}31%,90%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.dot{animation:dt .9s infinite ease-in-out}
@keyframes dt{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-4px);opacity:1}}
.caret{animation:cr 1s steps(1) infinite}
@keyframes cr{50%{opacity:0}}
.ring{animation:rg 2.4s ease-in-out infinite}
@keyframes rg{0%,100%{opacity:.45}50%{opacity:1}}
.sendbtn{transform-box:fill-box;transform-origin:center;animation:sb 10s infinite}
@keyframes sb{0%,3%{transform:scale(1)}4%{transform:scale(.9)}6%,100%{transform:scale(1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:ey 4.6s infinite}
@keyframes ey{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:ea 6s infinite}
@keyframes ea{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-9deg)}88%{transform:rotate(3deg)}92%{transform:rotate(0)}}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:tl 1.1s ease-in-out infinite alternate}
@keyframes tl{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
.pet{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

