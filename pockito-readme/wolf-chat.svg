<rect x="156" y="218" width="258" height="58" rx="14" fill="#F3F8FE" stroke="#3D8EE8" stroke-width="2"/>
<rect class="caret" x="169" y="230" width="1.8" height="20" fill="#3B4A63"/>
<text x="173" y="244" font-size="16.5" fill="#8A97A9">Say something to your wolf...</text>

